format: custom-envelope
rfc9457: false
envelope:
  media_type: application/json
  shape:
    requestId: string — server-assigned request identifier, echo it when contacting support
    resource: string — the resource family that failed (e.g. "knowledge", "style")
    errors: array — human-readable error messages
  schemas: [Knowledge400Error, Knowledge500Error, Attachment400Error, Attachment500Error, StyleError]
  note: >-
    Jasper does not use RFC 9457 application/problem+json. There is no `type` URI, no `title` and no
    `status` member — the envelope is a `requestId` + `resource` + `errors[]` object. Only 5 of the
    95 component schemas are error schemas, and most operations declare 4xx/5xx with a description
    only and no typed body, so an agent cannot reliably parse a machine-readable failure reason.
