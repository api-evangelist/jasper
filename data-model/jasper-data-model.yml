observations:
- >-
  Voice, Audience, StyleGuide and KnowledgeItem form a shared "brand context" bundle that every
  generation surface (Command, Template, AgentTask, Project) references by the SAME four id fields.
  That bundle is Jasper IQ expressed in the contract.
- >-
  Audience and StyleGuide are read-only over the API — they can be referenced but not created or
  changed, so an agent can consume brand governance but cannot author it.
