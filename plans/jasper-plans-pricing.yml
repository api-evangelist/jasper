notes: >-
  Jasper publishes two named plans on its public pricing page. Only the Pro tier carries a public
  price; the Business tier is "custom pricing / Contact Sales". API access — including the REST API
  at https://api.jasper.ai/v1 and the hosted MCP server — is a Business-tier entitlement, so the
  API surface itself has no published price. No usage/overage rate card, no per-call or per-token
  pricing, and no published quota for API calls; the per-workspace rate limits in
  rate-limits/jasper-rate-limits.yml are the only published usage ceiling.
