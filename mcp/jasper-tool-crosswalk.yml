surfaces:
  openapi:
    file: openapi/jasper-api-openapi.yml
    servers: [https://api.jasper.ai]
    operations: 50
    gated: false
  mcp:
    url: https://mcp.jasper.ai/
    transport: http
    gated: true
    gate: OAuth 2.0 bearer (scope `mcp`), Dynamic Client Registration at https://api.jasper.ai/oauth2/register
  graphql:
    present: false
crosswalk:
- tool: get-jasper-brand-voices
  category: brand-context
  rest: [getAllTones]
  binding: rest
  confidence: high
  note: >-
    Jasper's REST API names brand voices "tones" (tag `Voices`, path /v1/tones); the MCP tool uses
    the product name "brand voices". Same resource.
- tool: get-jasper-audiences
  category: brand-context
  rest: [getAllAudiences]
  binding: rest
  confidence: high
- tool: get-jasper-style-guides
  category: brand-context
  rest: [getStyle]
  binding: rest
  confidence: high
  note: GET /v1/styles returns the workspace style guides.
- tool: search-knowledge-base
  category: knowledge
  rest: [searchKnowledge]
  binding: rest
  confidence: high
  note: POST /v1/knowledge/search — natural-language search over workspace Knowledge.
- tool: get-jasper-agents
  category: agents
  rest: [listTasks]
  binding: rest
  confidence: medium
  note: >-
    The REST surface models agents as "agent tasks" (GET /v1/tasks returns public + custom
    workspace agent tasks). The MCP tool is named for the product concept "agents".
- tool: run-jasper-agent
  category: agents
  rest: [runTask, runTaskStream]
  binding: rest
  confidence: medium
  note: >-
    Fans out to two operations — POST /v1/tasks/{id}/run and the SSE variant
    POST /v1/tasks/{id}/run/stream. Which one the MCP server calls is not published.
- tool: generate-content
  category: generation
  rest: [command, completeTemplate]
  binding: rest
  confidence: medium
  note: >-
    POST /v1/command is the free-form generation operation; POST /v1/templates/{templateId}/run
    runs a named template. The MCP tool description ("Generate on-brand content with Jasper") does
    not say which it dispatches to, so both are recorded.
