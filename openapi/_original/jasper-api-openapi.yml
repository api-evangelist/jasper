    ProjectCreateRequestDto:
      type: object
      properties:
        userId:
          type: string
          description: The ID of the user creating the project
          example: usr_535B1EC15F5F41EAB1B400E9ED4077B6
        name:
          type: string
          description: The name of the project
          example: My Project
        accessLevel:
          type: string
          description: Who can access the new project. `PRIVATE` (default) restricts access to the owning user; `WORKSPACE`
            shares the project with all members of the calling workspace.
          enum:
          - PRIVATE
          - WORKSPACE
          example: PRIVATE
        settings:
          description: Optional default settings to seed on the project (goal, brand voice, audience, style, knowledge).
          allOf:
          - $ref: '#/components/schemas/ProjectSettingsDto'
        metadata:
          type: object
          description: An optional set of key-value pairs to attach any data you wish to the project, in a structured format.
            You can specify up to 10 keys, with key names up to 40 characters long and values up to 500 characters long. `null`
            values are accepted but ignored on create (there is nothing to clear yet) and are supported for symmetry with
            the update endpoint.
          additionalProperties:
            type: string
            nullable: true
          example:
            externalId: ext_123
            source: crm
      required:
      - userId
      - name
    ProjectData:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the project
          example: prj_073D2D49094A4AED991A47B614522579
        name:
          type: string
          description: The name of the project
          example: My Canvas
        userId:
          type: string
          description: The ID of the user creating the project
          example: usr_073D2D49094A4AED991A47B614522579
        appUrl:
          type: string
          description: The client URL to view the project in the Jasper app
          example: https://app.jasper.ai/canvas/edit/962e4d4c-ffdc-4c7a-83e3-8f4e715004cf
        accessLevel:
          type: string
          description: Who currently has access to the project. `WORKSPACE` means every member of the calling workspace can
            access it; `PRIVATE` means access is limited to the owner (and anyone explicitly shared in).
          enum:
          - PRIVATE
          - WORKSPACE
          example: PRIVATE
        settings:
          description: Project-level defaults (goal, brand voice, audience, style guide, knowledge). Fields are omitted when
            not configured. Tone, style, and knowledge IDs are returned in their public (`ton_*` / `sty_*` / `kno_*`) form.
          allOf:
          - $ref: '#/components/schemas/ProjectSettingsDto'
        metadata:
          type: object
          description: Set of key-value pairs previously attached to the project via create/update. Omitted from the response
            when no metadata is set.
          additionalProperties:
            type: string
          example:
            externalId: ext_123
            source: crm
      required:
      - id
      - name
      - userId
      - appUrl
    ProjectResponseDto:
