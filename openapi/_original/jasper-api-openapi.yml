          example: https://app.jasper.ai/jasper-iq/style-guides/sty_f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0
        terms:
          example:
          - type: REPLACE
            term: waz
            replaceWith: What's
          - type: ABBREVIATE_AFTER_FIRST
            term: Mergers & Acquisitions
            replaceWith: M&A
          - type: REPLACE_FIRST_INSTANCE
            term: Jasper®
            replaceWith: Jasper
          type: array
          items:
            type: string
        rules:
          example:
          - name: activeVoice
            type: boolean
            value: true
            ignore: enabled
          - name: contractions
            type: boolean
            value: false
            ignore: disabled
          - name: emDashAside
            type: boolean
            value: false
            ignore: disabled
          - name: emDashSpaces
            type: boolean
            value: false
            ignore: disabled
          - name: enDashRanges
            type: boolean
            value: false
            ignore: disabled
          - name: exclamationPoints
            type: boolean
            value: true
            ignore: enabled
          - name: formatNumerals
            type: boolean
            value: true
            ignore: enabled
          - name: locale
            type: locale
            value: EN_US
            ignore: enabled
          - name: oxfordComma
            type: boolean
            value: false
            ignore: disabled
          - name: removeAmpersands
            type: boolean
            value: false
            ignore: disabled
          - name: removePlusAsAnd
            type: boolean
            value: true
            ignore: enabled
          - name: removeSemicolons
            type: boolean
            value: false
            ignore: disabled
          - name: spacesAfterPeriod
            type: number
            value: 1
            ignore: disabled
          - name: spellNumbers
            type: number
            value: 100
            ignore: enabled
          type: array
          items:
            type: string
      required:
      - id
      - name
      - description
      - customInstructions
      - createdAt
      - createdBy
      - updatedAt
      - appUrl
      - terms
      - rules
    StyleError:
