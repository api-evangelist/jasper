  /beta/image-template/{template_id}:
    get:
      description: Retrieve template metadata (version, dimensions, workspace) and a list of all layers with their properties.
        This endpoint provides information about what layers are available in the template and what properties can be edited
        for each layer.
      operationId: getImageTemplate
      parameters:
      - name: template_id
        required: true
        in: path
        description: The external ID of the template to introspect
        schema:
          type: string
      responses:
        '200':
          description: Template introspection data retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The external ID of the template
                  metadata:
                    type: object
                    properties:
                      width:
                        type: number
                        description: Template width in pixels
                        example: 1080
                      height:
                        type: number
                        description: Template height in pixels
                        example: 1080
                      visibility:
                        type: string
                        enum:
                        - private
                        - public
                        description: 'Template visibility: "private" if associated with a specific workspace, "public" otherwise'
                        example: private
                  layers:
                    type: array
                    description: List of layers in the template
                    items:
                      type: object
                      required:
                      - name
                      - type
                      - editableProperties
                      - width
                      - height
                      - x
                      - y
                      properties:
                        name:
                          type: string
                          description: Layer name (used for referencing in render endpoint)
                        type:
                          type: string
                          description: Layer type (text, image, etc.)
                          example: text
                        editableProperties:
                          type: array
                          description: List of properties that can be edited for this layer
                          items:
                            type: string
                          example:
                          - content
                          - color
                          - font
                          - backgroundColor
                        width:
                          type: integer
                          description: Layer width in pixels
                          example: 200
                        height:
                          type: integer
                          description: Layer height in pixels
                          example: 100
                        x:
                          type: integer
                          description: Layer x-coordinate position
                          example: 50
                        y:
                          type: integer
                          description: Layer y-coordinate position
                          example: 30
        '404':
          description: Template not found or access denied.
        '500':
          description: Internal server error. Unable to retrieve template information.
      security:
      - X-API-Key: []
      summary: Get template introspection data
      tags:
      - Image Templates
  /beta/image-template/render:
    post:
      description: 'Generate multiple variations of advertising images connecting a predefined template with dynamic content.
        You can dynamically update layer properties and page background using dot notation in form fields. For layers: "layers.author.text.content"
        to update text content. For background: "background.color" for solid colors or "background.imageFile" for image backgrounds.
        Only layers.* and background.* form fields will be processed as dynamic updates, other fields are ignored.'
      operationId: renderImageTemplate
      parameters: []
      requestBody:
        required: true
        description: Multi-layer image composition request parameters (form-data)
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                template_id:
                  type: string
                  format: uuid
                  description: Id of the template to render.
                scale:
                  type: number
                  description: 'Scale factor for the rendered image (0 < scale <= 4). Default: 1'
                  minimum: 0
                  maximum: 4
                  default: 1
                format:
                  type: string
                  enum:
                  - png
                  - jpeg
                  description: 'Output image format. Default: png'
                  default: png
                layers.{name}.text.content:
                  type: string
                  description: Update text content for a text layer
                layers.{name}.text.color:
                  type: string
                  description: Update text color
                layers.{name}.text.font:
                  type: string
                  format: binary
                  description: 'Upload a custom font file for a text layer (TTF, OTF, WOFF, WOFF2). Max size: 5MB'
                layers.{name}.text.opacity:
                  type: string
                  description: Set text layer opacity, value is a number between 0 and 1
                  maximum: 1
                layers.{name}.text.isVisible:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: Set text layer visibility
                layers.{name}.text.backgroundColor:
                  type: string
                  description: Update text background color
                layers.{name}.image.imageFile:
                  oneOf:
                  - type: string
                    format: binary
                    description: 'Upload an image file (PNG, JPEG, WebP). Max size: 5MB'
                  - type: string
                    format: url
                    description: URL of an image.
                layers.{name}.image.fit:
                  type: string
                  enum:
                  - contain
                  - cover
                  description: 'Auto-fit the image to the layer. Requires providing layers.{name}.image.imageFile in the same
                    request. "contain": no crop, resize and center the image. "cover": crop to fill the layer. Fit will override
                    any existing crop attributes in the template'
                layers.{name}.image.cropWidth:
                  type: string
                  description: Crop width as percentage (0-1). Cannot be used with fit attribute.
                  minimum: 0
                  maximum: 1
                  default: 1
                layers.{name}.image.cropHeight:
                  type: string
                  description: Crop height as percentage (0-1). Cannot be used with fit attribute.
                  minimum: 0
                  maximum: 1
                  default: 1
                layers.{name}.image.cropX:
                  type: string
                  description: Crop X offset as percentage (0-1). Cannot be used with fit attribute.
                  minimum: 0
                  maximum: 1
                  default: 0
                layers.{name}.image.cropY:
                  type: string
                  description: Crop Y offset as percentage (0-1). Cannot be used with fit attribute.
                  minimum: 0
                  maximum: 1
                  default: 0
                layers.{name}.image.opacity:
                  type: string
                  description: Set image layer opacity, value is a number between 0 and 1
                  minimum: 0
                  maximum: 1
                layers.{name}.image.isVisible:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: Set image layer visibility
                background.color:
                  type: string
                  description: Set page background to a solid color (e.g., "rgba(245,166,35,1)", "#FF0000", "white"). Cannot
                    be used with background.imageFile.
                background.imageFile:
                  type: string
                  format: binary
                  description: 'Upload an image file for page background (PNG, JPEG, WebP). Max size: 5MB. Cannot be used
                    with background.color.'
                layers.{name}.svg.color:
                  type: string
                  description: Update SVG fill color
                layers.{name}.svg.opacity:
                  type: string
                  description: Set svg layer opacity, value is a number between 0 and 1
                  minimum: 0
                  maximum: 1
                layers.{name}.svg.isVisible:
                  type: string
                  enum:
                  - 'true'
                  - 'false'
                  description: Set svg layer visibility
              required:
              - template_id
              additionalProperties: true
              example:
                template_id: 123e4567-e89b-12d3-a456-426614174000
                scale: 1
                background.color: rgba(245,166,35,1)
                format: png
                layers.author.text.content: Tom C.
                layers.author.text.color: '#FF0000'
                layers.author.text.font: <binary font file>
                layers.author.text.opacity: '0.8'
                layers.author.text.isVisible: 'true'
                layers.review.text.content: Nice product, I love it
                layers.review.text.backgroundColor: '#FFFFFF'
                layers.logo.image.imageFile: <binary file>
                layers.logo.image.fit: contain
                layers.logo.image.opacity: '0.5'
                layers.logo.image.isVisible: 'false'
                layers.icon.svg.color: '#00FF00'
                layers.icon.svg.opacity: '0.5'
                layers.icon.svg.isVisible: 'false'
      responses:
        '200':
          description: The image was successfully rendered.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs or options.
        '404':
          description: Template not found or access denied.
        '500':
          description: Internal server error. Unable to render image.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Render an image template with dynamic layer and background updates
      tags:
      - Image Templates
  /v1/projects:
    post:
      description: Create a new Project in your workspace
      operationId: createProject
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequestDto'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs.
        '401':
          description: Unauthorized access to the workspace.
        '404':
          description: Not found. May have an incorrect URL path.
        '500':
          description: Internal server error. Unable to create project.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Create a Project
      tags:
      - Projects
    get:
      description: Retrieve all Projects in your workspace
      operationId: getProjects
      parameters:
      - name: userId
        required: false
        in: query
        description: The user Id associated with the workspace
        schema:
          example: usr_535B1EC15F5F41EAB1B400E9ED4077B6
          type: string
      - name: name
        required: false
        in: query
        description: Filter by the project name
        schema:
          example: My Project
          type: string
      - name: limit
        required: false
        in: query
        description: The maximum number of results to return
        schema:
          maximum: 50
          default: 50
          example: 50
          type: number
      - name: page
        required: false
        in: query
        description: The number of results to skip before starting to collect the results
        schema:
          default: 1
          example: 1
          type: number
      - name: sort
        required: false
        in: query
        description: The sorting order for the projects
        schema:
          default: LAST_UPDATED
          example: LAST_UPDATED
          type: string
          enum:
          - LAST_UPDATED
          - OLDEST_UPDATED
          - ALPHABETICAL
          - REVERSE_ALPHABETICAL
          - NEWEST_CREATED
          - OLDEST_CREATED
      - name: createdAtStart
        required: false
        in: query
        description: Start date for the created at filter
        schema:
          default: ''
          example: '2021-09-01T00:00:00.000Z'
          type: string
      - name: createdAtEnd
        required: false
        in: query
        description: End date for the created at filter
        schema:
          default: ''
          example: '2021-09-01T00:00:00.000Z'
          type: string
      - name: q
        required: false
        in: query
        description: 'IQ-style search query. Combine up to 10 filters with `AND`. Supported tokens: `userId:<id>` (equality
          on the project owner), `metadata[<key>]:<value>` (equality on the project metadata JSONB column). Example: `userId:usr_535B1EC15F5F41EAB1B400E9ED4077B6
          AND metadata[source]:crm`. The query is matched in SQL against the projects table — every recognised token contributes
          an additive `AND` predicate to the underlying `where` clause.'
        schema:
          example: userId:usr_535B1EC15F5F41EAB1B400E9ED4077B6 AND metadata[source]:crm
          type: string
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs.
        '401':
          description: Unauthorized access to the workspace.
        '404':
          description: Not found. May have an incorrect URL path.
        '500':
          description: Internal server error. Unable to get projects.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve Projects
      tags:
      - Projects
  /v1/projects/{id}:
    get:
      description: Retrieve a specific Project in your workspace by ID
      operationId: getProjectById
      parameters:
      - name: id
        required: true
        in: path
        description: The Project's unique ID
        schema:
          example: prj_535B1EC15F5F41EAB1B400E9ED4077B6
          type: string
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSingleResponseDto'
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs.
        '401':
          description: Unauthorized access to the workspace.
        '404':
          description: Not found. May have an incorrect URL path.
        '500':
          description: Internal server error. Unable to get project.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve Project by ID
      tags:
      - Projects
    delete:
      description: Deletes a specific Project in your workspace by ID
      operationId: deleteProject
      parameters:
      - name: id
        required: true
        in: path
        description: The Project's unique ID
        schema:
          example: prj_535B1EC15F5F41EAB1B400E9ED4077B6
          type: string
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDeleteResponseDto'
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs.
        '401':
          description: Unauthorized access to the workspace.
        '404':
          description: Not found. May have an incorrect URL path.
        '500':
          description: Internal server error. Unable to delete project.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Delete Project by ID
      tags:
      - Projects
    patch:
      description: Update a Project in your workspace
      operationId: updateProject
      parameters:
      - name: id
        required: true
        in: path
        description: The Project's unique ID
        schema:
          example: prj_535B1EC15F5F41EAB1B400E9ED4077B6
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequestDto'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponseDto'
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs.
        '401':
          description: Unauthorized access to the workspace.
        '404':
          description: Not found. May have an incorrect URL path.
        '500':
          description: Internal server error. Unable to update project.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Update Project by ID
      tags:
      - Projects
  /v1/templates:
    get:
      description: Retrieve all templates available in your workspace including default templates and custom templates
      operationId: getAllTemplates
      parameters: []
      responses:
        '200':
          description: Retrieve all templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetAllTemplatesResponseDto'
        '500':
          description: Internal server error. Unable to get templates.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve templates
      tags:
      - Templates
  /v1/templates/{templateId}:
    get:
      description: Retrieve an individual default or custom template available in your workspace by ID
      operationId: getTemplate
      parameters:
      - name: templateId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Retrieve template by ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTemplateResponseDto'
        '404':
          description: Not found. May have an incorrect URL path or template ID.
        '500':
          description: Internal server error. Unable to get specified template.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve template by ID
      tags:
      - Templates
  /v1/templates/{templateId}/run:
    post:
      description: Run a default template or custom template by ID to generate an AI output. See our guide on Using Templates
        for tips on getting started.
      operationId: completeTemplate
      parameters:
      - name: templateId
        required: true
        in: path
        description: The template's unique ID
        schema:
          example: skl_501CFB66C00F47ECA277BF4ECC99DD21
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTemplateRequest'
      responses:
        '200':
          description: Generate outputs for a specific template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteTemplateResponse'
        '400':
          description: Bad Request. May need to check that the request body corresponds with the input schema for the template
            you are trying to complete.
        '404':
          description: Not found. May be due to an incorrect URL path.
        '500':
          description: Internal server error. Unable to generate outputs for specified template.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Run template
      tags:
      - Templates
  /v1/usage:
    get:
      description: Retrieve API usage statistics for your workspace. Note that the statistics returned are for content generation
        requests only (e.g Run command or Run template).
      operationId: usage
      parameters:
      - name: start
        required: true
        in: query
        description: Start date for usage data
        schema:
          example: '2023-06-01T00:00:00.000Z'
          type: string
      - name: end
        required: true
        in: query
        description: End date for usage data
        schema:
          example: '2023-06-07T00:00:00.000Z'
          type: string
      - name: granularity
        required: true
        in: query
        description: Bucket size for usage data
        schema:
          example: day
          type: string
          enum:
          - week
          - day
          - hour
      responses:
        '200':
          description: Retrieved API usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponseDto'
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs or options.
        '500':
          description: Internal server error. Unable to run command.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve API usage
      tags:
      - Usage
  /v1/audiences/{audienceId}:
    get:
      description: Retrieve a specific audience in your workspace by ID
      operationId: getAudienceById
      parameters:
      - name: audienceId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Retrieve Audience by ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceResponse'
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs.
        '401':
          description: Unauthorized access to the workspace.
        '404':
          description: Not found. May have an incorrect URL path.
        '500':
          description: Internal server error. Unable to get specified audience.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve audience by ID
      tags:
      - Audiences
  /v1/audiences:
    get:
      description: Retrieve all audiences in your workspace
      operationId: getAllAudiences
      parameters:
      - name: page
        required: false
        in: query
        description: The desired page number of audiences
        schema:
          default: 1
          example: 1
          type: number
      - name: size
        required: false
        in: query
        description: The maximum number of audiences to return per page. Defaults to 10 if omitted.
        schema:
          minimum: 1
          default: 10
          example: 25
          type: number
      responses:
        '200':
          description: Retrieve all audiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudiencesResponse'
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs.
        '401':
          description: Unauthorized access to the workspace.
        '404':
          description: Not found. May have an incorrect URL path.
        '500':
          description: Internal server error. Unable to get audiences.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve audiences
      tags:
      - Audiences
info:
  title: Jasper API
  description: Jasper API
  version: '1.0'
  contact: {}
tags:
- name: Command
  description: ''
- name: Tasks
  description: ''
- name: Voices
  description: ''
- name: Styles
  description: ''
- name: Audiences
  description: ''
- name: Knowledge
  description: ''
- name: Attachments
  description: ''
- name: Images
  description: ''
- name: Image Templates
  description: ''
- name: Templates
  description: ''
- name: Projects
  description: ''
- name: Documents
  description: ''
- name: Users
  description: ''
- name: Usage
  description: ''
servers:
- url: https://api.jasper.ai
components:
  securitySchemes:
    X-API-Key:
      type: apiKey
      in: header
      name: X-API-Key
      description: Workspace authentication using API key tokens in the X-API-Key header.
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.jasper.ai/oauth2/authorize
          tokenUrl: https://api.jasper.ai/oauth2/token
          refreshUrl: https://api.jasper.ai/oauth2/token
          scopes:
            user:read: Read user information
            user: Read and write user information
      description: User-level authentication using OAuth bearer tokens in the Authorization header.
  schemas:
    CreateAttachmentDto:
      type: object
      properties:
        type:
          type: string
          enum:
          - FILE
          - TEXT
          - URL
          description: 'The kind of attachment being created. In every case the payload is carried on the `value` multipart
            part: FILE sends binary file bytes, TEXT sends a raw text string, URL sends a URL string.'
          example: FILE
        value:
          oneOf:
          - title: binary
            type: string
            format: binary
          - title: string
            type: string
          description: 'The attachment payload. Its shape depends on `type`: for FILE, the binary file bytes (multipart file
            part; pick `binary` in the docs UI); for TEXT, a raw text string (form field; pick `string`); for URL, a URL string
            (form field; pick `string`).'
          example: Q3 retention numbers improved 12% YoY across enterprise segments.
      required:
      - type
      - value
    CreateAttachmentResource:
      type: object
      properties:
        id:
          type: string
          description: The temporary attachment ID. Reference this value in `attachmentIds` on a subsequent `POST /v1/tasks/{id}/run`
            call.
          example: tmp_2ee766eaa4ef48e59da1d9602bfecf2d
        type:
          type: string
          enum:
          - FILE
          - TEXT
          - URL
          description: The attachment type, echoing back the request `type`.
          example: FILE
      required:
      - id
      - type
    CreateAttachmentResponseDto:
      type: object
      properties:
        requestId:
          type: string
          example: 8393f82b3f6a4f6e8a405777b9305254
        resource:
          type: string
          example: knowledge
        data:
          $ref: '#/components/schemas/CreateAttachmentResource'
      required:
      - requestId
      - resource
      - data
    Attachment400Error:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        message:
          type: string
          example: 'Unsupported file type "exe". Supported extensions: pdf, docx, txt, md, png, …'
        error:
          type: string
          example: Bad Request
      required:
      - statusCode
      - message
      - error
    Attachment500Error:
      type: object
      properties:
        statusCode:
          type: number
          example: 500
        message:
          type: string
          example: Couldn't create attachment
        error:
          type: string
          example: Internal Server Error
      required:
      - statusCode
      - message
      - error
    TaskContextItem:
      type: object
      properties:
        id:
          type: string
          example: 5e9f3d7b-9ec6-44e7-b752-3977fef34c18
          description: Unique identifier for the context item
        name:
          type: string
          example: Original text
          description: Name of the context item
        type:
          type: string
          enum:
          - TEXTAREA
          - INPUT
          - TAGS_INPUT
          - SELECT
          - MULTISELECT
          - CUSTOM
          - KNOWLEDGE
          - IMAGE_ID
          - TOOL
          - CHECKBOX
          example: TEXTAREA
          description: Type of the context item
        question:
          type: string
          example: What text do you want to check?
          description: Question prompt for the context item
        options:
          example:
          - grammar
          - writing
          description: List of options for the context item
          type: array
          items:
            type: string
        tooltip:
          type: object
          example: null
          description: Tooltip text for the context item
          nullable: true
        required:
          type: boolean
          example: false
          description: Whether this context item is required
        value:
          type: object
          description: Value of the context item
      required:
      - id
      - name
      - type
    TaskResource:
      type: object
      properties:
        id:
          type: string
          example: agt_0190f3a1b2c34d5e6f7a8b9c0d1e2f3a
          description: Stable, public-facing identifier for the agent task. The internal UUID is also accepted anywhere this
            id is required.
        name:
          type: string
          example: Grammar Checker
          description: Name of the agent task
        appUrl:
          type: string
          example: https://app.jasper.ai/studio/962e4d4c-ffdc-4c7a-83e3-8f4e715004cf
          description: The client URL to view the agent task in the Jasper app. Empty when no link can be resolved.
        description:
          type: string
          example: Ensure your text is free from grammar errors to enhance clarity and professionalism
          description: Short description of the agent task
        contextItems:
          description: Context items required by the agent task
          type: array
          items:
            $ref: '#/components/schemas/TaskContextItem'
        generationSkillId:
          type: object
          description: Associated generation skill ID
          nullable: true
        version:
          type: number
          example: 1
          description: Version number of the agent task
        scope:
          type: string
          enum:
          - USER
          - WORKSPACE
          - PUBLIC
          example: PUBLIC
          description: Scope of the agent task (PUBLIC for those available to all users, WORKSPACE for those custom to your
            workspace)
        updatedAt:
          type: string
          example: '2024-10-29T03:47:44.468Z'
          description: Timestamp when the agent task was last updated
        createdAt:
          type: string
          example: '2024-10-02T03:51:26.020Z'
          description: Timestamp when the agent task was created
        longDescription:
          type: object
          example: '#### Overview

            Elevate the quality of your content by running it through a comprehensive grammar checker...'
          description: Extended description of the agent task in markdown format
          nullable: true
        publishedAt:
          type: object
          example: '2024-10-14T04:12:20.369Z'
          description: Timestamp when the agent task was published
          nullable: true
        customFields:
          type: object
          description: Custom fields associated with the agent task
          nullable: true
        theme:
          type: object
          description: Theme of the agent task
          nullable: true
        categories:
          example: []
          description: Categories the agent task belongs to
          nullable: true
          type: array
          items:
            type: string
      required:
      - id
      - name
      - appUrl
      - description
      - version
      - scope
      - updatedAt
      - createdAt
    TasksListResponseDto:
      type: object
      properties:
        requestId:
          type: string
          example: 07008c5a-f916-4bdc-bfda-e8f6c328f7c5
        resource:
          type: string
          example: tasks
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaskResource'
        pagination:
          type: object
          example:
            totalRecords: 100
            page: 1
            pageSize: 25
            next: '2'
            prev: null
    TaskResponseDto:
      type: object
      properties:
        requestId:
          type: string
          example: 07008c5a-f916-4bdc-bfda-e8f6c328f7c5
        resource:
          type: string
          example: tasks
        data:
          $ref: '#/components/schemas/TaskResource'
      required:
      - data
    PredefinedContextItemDto:
      type: object
      properties:
        id:
          type: string
          description: Context item ID
          example: 729d2dd3-9ec6-4930-b216-48b8923671ca
        value:
          description: 'Context item value - format depends on the context item type:

            • INPUT, TEXTAREA, SELECT, IMAGE_ID, TOOL, CUSTOM: string

            • MULTISELECT, TAGS_INPUT: string[] (array of selected values)

            • KNOWLEDGE: KnowledgeItemDto[] (array of knowledge objects with knowledgeId and optional knowledgeExtractionPrompt)

            • CHECKBOX: string ("true" or "false")'
          examples:
            stringValue:
              summary: Text input (INPUT/TEXTAREA/SELECT/IMAGE_ID/TOOL/CUSTOM)
              value: Sample text content
            arrayValue:
              summary: Multi-select or tags (MULTISELECT/TAGS_INPUT)
              value:
              - option1
              - option2
              - option3
            knowledgeValue:
              summary: Knowledge items (KNOWLEDGE type)
              value:
              - knowledgeId: kno_123
                knowledgeExtractionPrompt: Extract statistics, facts, and important timeline information
            checkboxValue:
              summary: Checkbox (CHECKBOX type)
              value: 'true'
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          - type: array
            items:
              type: object
              properties:
                knowledgeId:
                  type: string
                knowledgeExtractionPrompt:
                  type: string
      required:
      - id
      - value
    CustomContextItemDto:
      type: object
      properties:
        name:
          type: string
          description: The name/label of the custom context item
          example: Greeting
        question:
          type: string
          description: The question/prompt for this context item (how it will be presented to the model)
          example: Who is the person that you want me to greet in the registration reminder email?
        answer:
          type: string
          description: The value/answer for this custom context item
          example: Tim Everett
        priority:
          type: number
          description: The priority of this context item (higher priority = more important)
          example: 1
          default: 0
      required:
      - name
      - question
      - answer
    KnowledgeItemDto:
      type: object
      properties:
        knowledgeId:
          type: string
          description: The ID of the knowledge to be injected
          example: kno_123
        inputId:
          type: string
          description: The placeholder name of the knowledge to be injected
          example: company_info
        knowledgeExtractionPrompt:
          type: string
          description: The prompt to extract specific information from the knowledge
          example: Extract statistics, facts, and important timeline information
      required:
      - knowledgeId
    TaskRunDto:
      type: object
      properties:
        contextItems:
          type: array
          description: Array of context items - can include both predefined context items (with id and value) and custom context
            items (with name, question, and answer)
          example:
          - id: 70346737-878b-4329-a4d6-9a054efef508
            value:
            - Registration reminder email
            - Confirmation email
          - name: Greeting
            question: Who is the person that you want me to greet in the registration reminder email?
            answer: John Doe
          items:
            oneOf:
            - $ref: '#/components/schemas/PredefinedContextItemDto'
            - $ref: '#/components/schemas/CustomContextItemDto'
        version:
          type: number
          description: Agent task version (optional, defaults to latest)
          example: 1
        toLanguage:
          type: string
          description: Target output language for the completion (optional, defaults to EN-US)
          example: EN-US
        knowledgeIds:
          description: Array of knowledge IDs to use as context to power the agent
          example:
          - kno_123
          - kno_456
          type: array
          items:
            type: string
        attachmentIds:
          description: Array of temporary attachment IDs (prefixed `tmp_`) to use as ad-hoc context for this run. Create attachments
            up front via `POST /v1/attachments` and pass the returned IDs here. Temporary attachments are intended for short-lived
            context (the same attachment can be referenced across retries of the same run) and are not durable — use `knowledgeIds`
            for content that should persist in your workspace.
          example:
          - tmp_2ee766eaa4ef48e59da1d9602bfecf2d
          type: array
          items:
            type: string
        toneId:
          type: string
          description: Tone ID for the brand voice of the agent's output
          example: ton_2ee766eaa4ef48e59da1d9602bfecf2d
        audienceId:
          type: string
          description: The primary audience ID used to customize the agent's output for a target audience.
          example: aud_123
        additionalAudienceIds:
          description: Additional audience IDs to customize the agent's output for multiple target audiences in a single run,
            included alongside the primary `audienceId`.
          example:
          - aud_456
          - aud_789
          type: array
          items:
            type: string
        styleGuideId:
          type: string
          description: Style Guide ID to apply writing rules to the agent's output
          example: sty_123
        tools:
          type: array
          description: Array of tools to enable for agent task execution. Can include WEB_SEARCH and/or KNOWLEDGE_SEARCH
          example:
          - WEB_SEARCH
          - KNOWLEDGE_SEARCH
