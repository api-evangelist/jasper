openapi: 3.1.0
paths:
  /v1/attachments:
    post:
      description: 'Create a temporary attachment for use as ad-hoc context on a Task Agent run. Submit as `multipart/form-data`.
        The `type` form field discriminates the payload carried on `value`: for FILE, send the file bytes as the `value` multipart
        part; for TEXT and URL, send the payload as the `value` form field. Reference the returned `id` in `attachmentIds`
        on a subsequent `POST /v1/tasks/{id}/run` call.


        The returned attachment ID is currently only accepted by `POST /v1/tasks/{id}/run` (via the `attachmentIds` field).
        It is not supported by other endpoints.


        Temporary attachments are intended for short-lived context (the same attachment can be referenced across retries of
        the same run) and should not be relied on for durable storage. Use the Knowledge API (`POST /v1/knowledge`) for content
        that should persist in your workspace.'
      operationId: createAttachment
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAttachmentDto'
      responses:
        '201':
          description: Attachment created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAttachmentResponseDto'
        '400':
          description: Bad request. Missing required fields or unsupported file type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment400Error'
        '500':
          description: Internal server error. Unable to create attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment500Error'
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Create a temporary attachment
      tags:
      - Attachments
  /v1/tasks:
    get:
      description: Retrieve all agent tasks available in your workspace including public agent tasks and custom workspace
        agent tasks
      operationId: listTasks
      parameters:
      - name: size
        required: false
        in: query
        description: Number of agent tasks to return per page
        schema:
          minimum: 1
          maximum: 100
          default: 100
          example: 100
          type: number
      - name: page
        required: false
        in: query
        description: Page number (1-indexed)
        schema:
          minimum: 1
          default: 1
          example: 1
          type: number
      - name: scope
        required: false
        in: query
        description: 'Filter by agent task scope: PUBLIC or WORKSPACE'
        schema:
          example: PUBLIC
          type: string
          enum:
          - USER
          - WORKSPACE
          - PUBLIC
      - name: includeContextItems
        required: false
        in: query
        description: Include context items (input fields) in the response for the task to be executed by the agent. Default
          is false.
        schema:
          default: false
          example: false
          type: boolean
      - name: includeCategories
        required: false
        in: query
        description: Include categories for the agent tasks in the response. Default is false.
        schema:
          default: false
          example: false
          type: boolean
      - name: searchTerm
        required: false
        in: query
        description: Search term to filter agent tasks by name, description, categories, or tags. Performs partial case-insensitive
          matching.
        schema:
          example: blog
          type: string
      responses:
        '200':
          description: Successfully retrieved list of agent tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksListResponseDto'
        '500':
          description: Internal server error. Unable to get agent tasks.
      security:
      - X-API-Key: []
      - oauth2:
        - user:read
      summary: List all agent tasks
      tags:
      - Tasks
  /v1/tasks/{id}:
    get:
      description: Retrieve a specific agent task by its unique identifier
      operationId: getTaskById
      parameters:
      - name: id
        required: true
        in: path
        description: The external ID (agt_…) or internal UUID of the agent task
        schema:
          example: agt_0190f3a1b2c34d5e6f7a8b9c0d1e2f3a
          type: string
      - name: version
        required: false
        in: query
        description: The agent task version to filter by. If not provided, the latest version will be used.
        schema:
          type: number
      responses:
        '200':
          description: Successfully retrieved agent task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponseDto'
        '404':
          description: Agent task not found. The specified app ID may not exist or you may not have access to it.
        '500':
          description: Internal server error. Unable to get agent task.
      security:
      - X-API-Key: []
      - oauth2:
        - user:read
      summary: Get agent task by ID
      tags:
      - Tasks
  /v1/tasks/{id}/run:
    post:
      description: Execute an agent task by ID to generate AI output. Provide the necessary context items and configuration
        in the request body.
      operationId: runTask
      parameters:
      - name: id
        required: true
        in: path
        description: The external ID (agt_…) or internal UUID of the agent task to run
        schema:
          example: agt_0190f3a1b2c34d5e6f7a8b9c0d1e2f3a
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRunDto'
      responses:
        '200':
          description: Successfully executed agent task and generated output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunResponseDto'
        '400':
          description: Bad Request. The request body may be missing required fields or contain invalid data. Check the agent
            task input schema.
        '404':
          description: Agent task not found. The specified app ID may not exist.
        '500':
          description: Internal server error. Unable to run agent task.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Run an agent task
      tags:
      - Tasks
  /v1/tasks/{id}/run/stream:
    post:
      description: Execute an agent task by ID to generate AI output with Server-Sent Events (SSE) streaming. Provides real-time
        content as it is generated.
      operationId: runTaskStream
      parameters:
      - name: id
        required: true
        in: path
        description: The external ID (agt_…) or internal UUID of the agent task to run
        schema:
          example: agt_0190f3a1b2c34d5e6f7a8b9c0d1e2f3a
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRunDto'
      responses:
        '200':
          description: Stream of events containing step updates and content chunks
          content:
            application/json:
              schema:
                type: object
                description: SSE stream with multiple event types
                oneOf:
                - type: object
                  properties:
                    step:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        status:
                          type: string
                          enum:
                          - loading
                          - completed
                        label:
                          type: string
                  example:
                    step:
                      id: f1d3b309-67bd-4054-a852-8806bc1a5344
                      status: loading
                      label: Generating content
                - type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    content:
                      type: string
                    role:
                      type: string
                    usage:
                      type: object
                      nullable: true
                    skillId:
                      type: string
                      format: uuid
                    contentId:
                      type: string
                      format: uuid
                  example:
                    id: 155cb8fc-d483-49e1-9cb5-ae30c04f5ef0
                    content: .
                    role: JASPER
                    usage: null
                    skillId: 8c1ede2b-8067-4633-9ba9-2fa0c8f59a2f
                    contentId: 155cb8fc-d483-49e1-9cb5-ae30c04f5ef0
                - type: object
                  description: Error event sent during stream (HTTP 200 with error payload)
                  properties:
                    statusCode:
                      type: number
                    message:
                      type: string
                    error:
                      type: string
                  example:
                    statusCode: 400
                    message: app not found
                    error: HttpException
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Run an agent task with streaming response
      tags:
      - Tasks
  /v1/command:
    post:
      description: Run a command to generate an AI Output
      operationId: command
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandDto'
      responses:
        '201':
          description: Created. The command ran successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponseDto'
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs or options.
        '500':
          description: Internal server error. Unable to run command.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Run command
      tags:
      - Command
  /v1/knowledge:
    post:
      description: Create a knowledge item for use in personalizing AI outputs
      operationId: uploadKnowledgeDocument
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KnowledgeInputDto'
      responses:
        '201':
          description: Created. The new knowledge item was added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrUpdateKnowledgeResponseDto'
        '400':
          description: Bad request. May be missing required fields or may have badly formatted inputs or options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge400Error'
        '500':
          description: Internal server error. Unable to create knowledge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge500Error'
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Create a knowledge item
      tags:
      - Knowledge
    get:
      description: Returns a list of knowledge items available to your workspace, sorted from most recently created
      operationId: getKnowledgeDocuments
      parameters:
      - name: q
        required: false
        in: query
        description: "You can use the `q` parameter to run a query parameter search. Query parameter search supports the following\
          \ fields: `name`, `tags`, `metadata`, and `settings`.\n\nSupported operators: `AND` \n\nThe `AND` operator can be\
          \ used to combine multiple search criteria. \n\n`NOTE`: The `AND` operator supports a maximum of `10` operators\
          \ \n\nAvailable field examples: \n\n`name: value` \n\n`tags: value` \n\n`metadata[key]:value` \n\n`settings[appVisibility]:visible`\
          \ \n\n`metadata[key1]:value1 AND metadata[key2]:value2` \n\n"
        schema:
          example: metadata[key]:value
          type: string
      - name: page
        required: false
        in: query
        description: The desired page number of Knowledge items
        schema:
          default: 1
          example: 1
          type: number
      - name: size
        required: false
        in: query
        description: The number of Knowledge items per page to return in the response
        schema:
          default: 10
          example: 10
          type: number
      responses:
        '200':
          description: Retrieve knowledge items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllKnowledgeResponseDto'
        '400':
          description: Bad request. May be missing required fields or may have badly formatted inputs or options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge400Error'
        '500':
          description: Internal server error. Unable to get knowledge items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge500Error'
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve knowledge items
      tags:
      - Knowledge
  /v1/knowledge/{knowledgeId}:
    get:
      description: Retrieve a knowledge item by ID
      operationId: getKnowledgeDocument
      parameters:
      - name: knowledgeId
        required: true
        in: path
        description: The knowledge items unique ID
        schema:
          example: kno_2ee766eaa4ef48e59da1d9602bfecf2d
          type: string
      responses:
        '200':
          description: Retrieve a knowledge item by ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetKnowledgeResponseDto'
        '400':
          description: Bad request. May be missing required fields or may have badly formatted inputs or options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge400Error'
        '404':
          description: Not found. May have an incorrect URL path or Knowledge ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge400Error'
        '500':
          description: Internal server error. Unable to get Knowledge by ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge500Error'
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve knowledge item by ID
      tags:
      - Knowledge
    patch:
      description: Update an existing knowledge item by ID
      operationId: updateKnowledgeDocument
      parameters:
      - name: knowledgeId
        required: true
        in: path
        description: The Knowledge's unique ID
        schema:
          example: kno_2ee766eaa4ef48e59da1d9602bfecf2d
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KnowledgeUpdateInput'
      responses:
        '200':
          description: Update an existing Knowledge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrUpdateKnowledgeResponseDto'
        '400':
          description: Bad request. May be missing required fields or may have badly formatted inputs or options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge400Error'
        '404':
          description: Not found. May have an incorrect URL path or Knowledge ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge400Error'
        '500':
          description: Internal server error. Unable to update Knowledge by ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge500Error'
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Update a knowledge item by ID
      tags:
      - Knowledge
    delete:
      description: Delete an existing knowledge item by ID
      operationId: deleteKnowledgeDocument
      parameters:
      - name: knowledgeId
        required: true
        in: path
        description: The Knowledge's unique ID
        schema:
          example: kno_2ee766eaa4ef48e59da1d9602bfecf2d
          type: string
      responses:
        '200':
          description: Knowledge item deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteKnowledgeResponseDto'
        '404':
          description: Not found. May have an incorrect URL path or Knowledge ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge400Error'
        '500':
          description: Internal server error. Unable to get specified Knowledge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Knowledge500Error'
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Delete knowledge item by ID
      tags:
      - Knowledge
  /v1/knowledge/search:
    post:
      description: Searches through your Knowledge Base and returns items most relevant to the provided query. This endpoint
        is designed to support natural language search, allowing you to find Knowledge based on meaning and context—not just
        exact keyword matches.
      operationId: searchKnowledge
      parameters: []
      requestBody:
        required: true
        description: Search knowledge request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchKnowledgeRequestDto'
      responses:
        '201':
          description: Successfully retrieved list of Knowledge by relevance to the query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchKnowledgeResponseDto'
        '400':
          description: Bad request. May be missing required inputs or may have badly formatted inputs or options.
        '500':
          description: Internal server error. Unable to search Knowledge.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Search Knowledge
      tags:
      - Knowledge
  /v1/tones:
    post:
      description: Create a voice for use in personalizing AI outputs
      operationId: createTone
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateToneDto'
      responses:
        '201':
          description: Created. The new voice was added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetToneResponseDto'
        '400':
          description: Bad request. May be missing required fields or may have badly formatted inputs or options.
        '500':
          description: Internal server error. Unable to create the voice.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Create a voice
      tags:
      - Voices
    get:
      description: Returns a list of voices available to your workspace, sorted from most recently created
      operationId: getAllTones
      parameters:
      - name: q
        required: false
        in: query
        description: "You can use the `q` parameter to run a query parameter search. Query parameter search supports the following\
          \ fields: `name`, `metadata`, and `settings`.\n\nSupported operators: `AND` \n\nThe `AND` operator can be used to\
          \ combine multiple search criteria. \n\n`NOTE`: The `AND` operator supports a maximum of `10` operators \n\nAvailable\
          \ field examples: \n\n`name: value` \n\n`metadata[key]:value` \n\n`settings[appVisibility]:visible` \n\n`metadata[key1]:value1\
          \ AND metadata[key2]:value2` \n\n"
        schema:
          example: metadata[key]:value
          type: string
      - name: page
        required: false
        in: query
        description: The desired page number of voices
        schema:
          default: 1
          type: number
      - name: size
        required: false
        in: query
        description: The number of voices per page to return in the response
        schema:
          default: 10
          type: number
      responses:
        '200':
          description: Retrieve voices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetAllTonesResponseDto'
        '500':
          description: Internal server error. Unable to get voices
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve all voices
      tags:
      - Voices
  /v1/tones/{toneId}:
    get:
      description: Retrieve a voice by ID
      operationId: getTone
      parameters:
      - name: toneId
        required: true
        in: path
        description: The voice's unique ID
        schema:
          example: ton_2ee766eaa4ef48e59da1d9602bfecf2d
          type: string
      responses:
        '200':
          description: Retrieve voice by ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetToneResponseDto'
        '404':
          description: Not found. May have an incorrect URL path or voice ID.
        '500':
          description: Internal server error. Unable to get specified voice ID.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve voice by ID
      tags:
      - Voices
    patch:
      description: Update an existing voice by ID
      operationId: updateTone
      parameters:
      - name: toneId
        required: true
        in: path
        description: The voice's unique ID
        schema:
          example: ton_2ee766eaa4ef48e59da1d9602bfecf2d
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateToneDto'
      responses:
        '200':
          description: Update an existing voice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetToneResponseDto'
        '404':
          description: Not found. May have an incorrect URL path or voice ID.
        '500':
          description: Internal server error. Unable to update specified voice.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Update voice by ID
      tags:
      - Voices
    delete:
      description: Delete an existing voice by ID
      operationId: deleteTone
      parameters:
      - name: toneId
        required: true
        in: path
        description: The voice's unique ID
        schema:
          example: ton_2ee766eaa4ef48e59da1d9602bfecf2d
          type: string
      responses:
        '200':
          description: Voice deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteToneResponseDto'
        '404':
          description: Not found. May have an incorrect URL path or voice ID.
        '500':
          description: Internal server error. Unable to get specified voice.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Delete voice by ID
      tags:
      - Voices
  /v1/styles:
    get:
      description: Returns a list of style guides available to your workspace, sorted from most recently created
      operationId: getStyle
      parameters: []
      responses:
        '200':
          description: The list of all style guides in the workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleResponseDto'
        '500':
          description: Something unexpected happened while trying to get the style guide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleError'
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve all style guides
      tags:
      - Styles
  /v1/styles/{styleId}:
    get:
      description: Returns a single style guide available to your workspace, fetched by its ID.
      operationId: getStyleById
      parameters:
      - name: styleId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: The requested style guide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleResponseDto'
        '404':
          description: No Style Guide found for the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleError'
        '500':
          description: Something unexpected happened while trying to get the style guide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleError'
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve style guide by ID
      tags:
      - Styles
  /v1/documents:
    get:
      description: Retrieve all documents in your workspace
      operationId: getAllDocuments
      parameters:
      - name: userId
        required: false
        in: query
        description: The user Id associated with the workspace
        schema:
          example: usr_535B1EC15F5F41EAB1B400E9ED4077B6
          type: string
      - name: size
        required: false
        in: query
        description: The maximum number of results to return
        schema:
          maximum: 50
          default: 50
          example: 50
          type: number
      - name: page
        required: false
        in: query
        description: The number of results to skip before starting to collect the results
        schema:
          default: 1
          example: 1
          type: number
      - name: sort
        required: false
        in: query
        description: The sorting order for the documents
        schema:
          example: LAST_UPDATED
          type: string
          enum:
          - LAST_UPDATED
          - OLDEST_UPDATED
          - ALPHABETICAL
          - REVERSE_ALPHABETICAL
          - NEWEST_CREATED
          - OLDEST_CREATED
      - name: name
        required: false
        in: query
        description: Filter documents by name
        schema:
          example: Project Report
          type: string
      - name: statuses
        required: false
        in: query
        description: Filter documents by statuses
        schema:
          example:
          - DRAFT
          - PUBLISHED
          type: array
          items:
            type: string
            enum:
            - DRAFT
            - PUBLISHED
            - IN PROGRESS
            - IN REVIEW
            - COMPLETED
      - name: createdAtStart
        required: false
        in: query
        description: Start date for the created at filter
        schema:
          example: '2021-09-01T00:00:00.000Z'
          type: string
      - name: createdAtEnd
        required: false
        in: query
        description: End date for the created at filter
        schema:
          example: '2021-09-01T00:00:00.000Z'
          type: string
      responses:
        '200':
          description: Retrieve all documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: Unauthorized. User is not a member of the workspace.
        '404':
          description: Not found. May have an incorrect URL path.
        '500':
          description: Internal server error. Unable to get documents.
      security:
      - X-API-Key: []
      - oauth2:
        - user
      summary: Retrieve documents
      tags:
      - Documents
    post:
      description: Create a new document in your workspace
      operationId: createDocument
